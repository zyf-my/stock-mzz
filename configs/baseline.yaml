# 阶段 2：当天截面 LightGBM，不看历史窗口
# 继承 configs/default.yaml 的数据路径与 seed

include: configs/default.yaml

features:
  use_num: true
  # 低/中基数类别。5 号列约 4094 档，疑似股票 ID，默认关闭
  cat_indices: [0, 1, 2, 3, 4, 6, 7, 8]
  use_stock_id_cat: false  # 若为 true，再把 cat_indices 的 5 加进去

model:
  name: lightgbm
  params:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    objective: regression
    verbosity: -1

train:
  # 主验证永远是官方时间切分，不要改成随机 K 折
  eval_split: valid
  # 无效测试位置占位分数
  fill_invalid: 0.0

paths:
  checkpoint: checkpoints/baseline.txt
  valid_pred: outputs/baseline_valid.npy
  test_pred: outputs/baseline_test.npy
  importance: outputs/baseline_importance.csv
  submission: submissions/task1_baseline.npy
