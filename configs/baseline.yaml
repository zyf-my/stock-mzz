# 阶段 2：当天截面 LightGBM（落实官方提示 2：在股票维 S 上建模）
# 因果：每个样本只用当天 num_x / cat_x；截面与行业 z-score 只用当天 mask_x。
# 继承 configs/default.yaml；本机数据路径见 configs/local.yaml

include: configs/default.yaml

features:
  use_num: true
  # 原始数值 + 当天全市场 z-score + 当天行业(列 6)内 z-score
  include_raw: true
  cs_zscore: true
  industry_zscore: true
  industry_col: 6
  # 低/中基数类别。5 号列约 4094 档，疑似股票 ID，默认关闭
  cat_indices: [0, 1, 2, 3, 4, 6, 7, 8]
  use_stock_id_cat: false
  # 本机约 16GB：训练按日下采样。valid/test 仍全市场评估
  max_train_stocks_per_day: 800

model:
  name: lightgbm
  params:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    objective: regression
    verbosity: -1

train:
  # 主验证永远是官方时间切分，不要改成随机 K 折
  eval_split: valid
  # 无效测试位置占位分数
  fill_invalid: 0.0

paths:
  checkpoint: checkpoints/baseline.txt
  valid_pred: outputs/baseline_valid.npy
  test_pred: outputs/baseline_test.npy
  importance: outputs/baseline_importance.csv
  submission: submissions/task1_baseline.npy
