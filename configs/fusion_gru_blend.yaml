# 把 GRU 当作第三支，和当前最强双轴融合（0.106）再加权。
# 需要 outputs/gru_*.npy 与 outputs/fusion_*.npy。不覆盖 task1_fusion.npy。
# 内存复算：gru 0.25 + fusion 0.75 → valid 0.1101。网格含 0.25。
include: configs/default.yaml

inputs:
  temporal_valid: outputs/gru_valid.npy
  temporal_test: outputs/gru_test.npy
  cross_section_valid: outputs/fusion_valid.npy
  cross_section_test: outputs/fusion_test.npy
  industry_col: 6

fusion:
  weight_grid: [0.0, 0.15, 0.25, 0.4, 0.5, 0.7, 1.0]

paths:
  valid_pred: outputs/fusion_gru_blend_valid.npy
  test_pred: outputs/fusion_gru_blend_test.npy
  submission: submissions/task1_fusion_gru_blend.npy
  lock: outputs/fusion_gru_blend_lock.json
