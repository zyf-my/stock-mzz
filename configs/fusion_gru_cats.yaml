# gru_cats 训完后用。第三支换成带类别的 GRU，仍与树融合 0.106 加权。
# 仅当 gru_cats valid > gru-001 的 0.0865 时再跑。不覆盖 task1_fusion.npy。
include: configs/default.yaml

inputs:
  temporal_valid: outputs/gru_cats_valid.npy
  temporal_test: outputs/gru_cats_test.npy
  cross_section_valid: outputs/fusion_valid.npy
  cross_section_test: outputs/fusion_test.npy
  industry_col: 6

fusion:
  weight_grid: [0.0, 0.15, 0.25, 0.4, 0.5, 0.7, 1.0]

paths:
  valid_pred: outputs/fusion_gru_cats_valid.npy
  test_pred: outputs/fusion_gru_cats_test.npy
  submission: submissions/task1_fusion_gru_cats.npy
  lock: outputs/fusion_gru_cats_lock.json
