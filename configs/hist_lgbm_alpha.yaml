# Alpha 风格历史算子 + DoubleEnsemble。全 train、每天 800 只，对齐 hist-lgbm-002。
# 窗口 [t-L, t)。不覆盖 hist_lgbm / 主融合。

include: configs/hist_lgbm.yaml

features:
  history:
    enabled: true
    length: 20
    source: cs_zscore
    ewm_halflife: 5
    num_indices: [5, 6, 7, 8, 10, 11, 17, 18, 19, 20, 21, 22, 24, 25, 39, 40, 41, 42, 57, 58, 66, 68, 69, 70, 73, 74, 90]
    stats: [mean, std, last, delta, ewm, ts_rank, slope]

train:
  double_ensemble: true
  double_keep_frac: 0.6

paths:
  checkpoint: checkpoints/hist_lgbm_alpha.txt
  valid_pred: outputs/hist_lgbm_alpha_valid.npy
  test_pred: outputs/hist_lgbm_alpha_test.npy
  importance: outputs/hist_lgbm_alpha_importance.csv
  submission: submissions/task1_hist_lgbm_alpha.npy
