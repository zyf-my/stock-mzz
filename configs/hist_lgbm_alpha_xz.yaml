# 相对锁定 alpha-x：只追加个股相对自己过去 20 日的 z（原 27 列）。
# 截面/行业/历史块不变。不覆盖主融合。

include: configs/hist_lgbm_alpha_x.yaml

features:
  stock_zscore:
    enabled: true
    length: 20
    clip: 5.0
    num_indices: [5, 6, 7, 8, 10, 11, 17, 18, 19, 20, 21, 22, 24, 25, 39, 40, 41, 42, 57, 58, 66, 68, 69, 70, 73, 74, 90]

paths:
  checkpoint: checkpoints/hist_lgbm_alpha_xz.txt
  valid_pred: outputs/hist_lgbm_alpha_xz_valid.npy
  test_pred: outputs/hist_lgbm_alpha_xz_test.npy
  importance: outputs/hist_lgbm_alpha_xz_importance.csv
  submission: submissions/task1_hist_lgbm_alpha_xz.npy
