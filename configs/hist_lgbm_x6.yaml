# 相对 hist_lgbm：只给历史统计追加 42, 58, 66, 69, 73, 74。当天截面特征不变。
# 不覆盖 hist_lgbm / fusion_valid。

include: configs/hist_lgbm.yaml

features:
  history:
    enabled: true
    length: 10
    source: cs_zscore
    num_indices: [5, 6, 7, 8, 10, 11, 17, 18, 19, 20, 21, 22, 24, 25, 39, 40, 41, 42, 57, 58, 66, 68, 69, 70, 73, 74, 90]
    stats: [mean, std, last]

paths:
  checkpoint: checkpoints/hist_lgbm_x6.txt
  valid_pred: outputs/hist_lgbm_x6_valid.npy
  test_pred: outputs/hist_lgbm_x6_test.npy
  importance: outputs/hist_lgbm_x6_importance.csv
  submission: submissions/task1_hist_lgbm_x6.npy
