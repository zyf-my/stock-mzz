# 相对 hist-lgbm-002 只加当天全市场状态：覆盖度 + 强列截面 mean/std。
# 当天 mask_x 上聚合，广播到每只股票；不用 mask_y / y1，不看未来。
# 不覆盖 hist_lgbm 产物。
include: configs/hist_lgbm.yaml

features:
  market_state:
    enabled: true
    include_coverage: true
    num_indices: [5, 6, 7, 8, 10, 11, 17, 18, 19, 20, 21, 22, 24, 25, 39, 40, 41, 57, 68, 70, 90]
    stats: [mean, std]

paths:
  checkpoint: checkpoints/hist_mkt.txt
  valid_pred: outputs/hist_mkt_valid.npy
  test_pred: outputs/hist_mkt_test.npy
  importance: outputs/hist_mkt_importance.csv
  submission: submissions/task1_hist_mkt.npy
