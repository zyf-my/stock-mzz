# y2 高覆盖 GRU：x6_today 特征 + stable 训练（rank MSE/cosine/accum8）+ 末 600 天窗口

include: configs/task2/gru_x6_with_today.yaml

model:
  target_mode: rank
  accum_days: 8
  lr_schedule: cosine
  head_dropout: 0.1
  weight_decay: 0.001

features:
  recent_days: 600

train:
  recent_days: 600

paths:
  checkpoint: checkpoints/task2/gru_x6_hicov.pt
  valid_pred: outputs/task2/gru_x6_hicov_valid.npy
  test_pred: outputs/task2/gru_x6_hicov_test.npy
  submission: submissions/task2_gru_x6_hicov.npy
