# y2 x6：rank MSE + stable 训练，保留末 800 天（非 hicov 600）

include: configs/task2/gru_x6_with_today.yaml

model:
  target_mode: rank
  accum_days: 8
  lr_schedule: cosine
  head_dropout: 0.1
  weight_decay: 0.001

paths:
  checkpoint: checkpoints/task2/gru_x6_rank800.pt
  valid_pred: outputs/task2/gru_x6_rank800_valid.npy
  test_pred: outputs/task2/gru_x6_rank800_test.npy
  submission: submissions/task2_gru_x6_rank800.npy
